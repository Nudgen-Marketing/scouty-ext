name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Layers 1 to 4: unit, static guarantees (on src/ and on every built bundle), UI, contract
      # (including the protocol-v1 checksum).
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Layer 5: the browser run against the mock LinkedIn and the capture-API stub.
      - run: npm run test:e2e
      - run: npm run test:gallery
      - run: npm run build
      - run: npm run lint:firefox
      # Firefox start-up smoke: web-ext installs dist/firefox as a temporary add-on in a real Firefox
      # and fails on a manifest or background error (release gate 8).
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: Firefox start-up smoke
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          "$FIREFOX_BIN" --version
          xvfb-run --auto-servernum npm run smoke:firefox
      # Two builds must give byte-identical output.
      - run: node tools/repro-check.mjs
      - name: No secrets or internal hostnames
        env:
          # Extra private patterns (internal hostnames) live in a repository secret, not in this public file.
          PRIVATE_DENY_PATTERNS: ${{ secrets.PRIVATE_DENY_PATTERNS }}
        run: |
          if git grep -nE "BEGIN [A-Z ]*PRIVATE KEY|client_secret|rk_live|sk-[A-Za-z0-9]{20}" -- . ':!test/static/static-rules.test.ts' ':!.github/workflows/ci.yml'; then
            echo "Forbidden pattern found"; exit 1
          fi
          if [ -n "$PRIVATE_DENY_PATTERNS" ] && git grep -qiE "$PRIVATE_DENY_PATTERNS" -- .; then
            echo "Private forbidden pattern found (see the PRIVATE_DENY_PATTERNS secret)"; exit 1
          fi
